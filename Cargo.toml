[package]
name = "keybard"
version = "0.1.0"
edition = "2024"

# All tests are integration tests (tests/integration); skip the empty
# unit-test and doctest harnesses, each of which would link all of Bevy.
[lib]
test = false
doctest = false

[[bin]]
name = "keybard"
test = false

[dependencies]
# Only what a 2D app with UI, text, gizmos and synthesised audio needs.
# Bevy's defaults add 3D/PBR, glTF, scenes, mesh picking, gamepads,
# clipboard, animation and audio codecs.
bevy = { version = "0.20.1", default-features = false, features = [
    # Core app and platform
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_log",
    "bevy_winit",
    "keyboard",
    "mouse",
    "x11",
    "wayland",
    # 2D rendering: sprites, Mesh2d, gizmos, text and UI
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite_render",
    "bevy_gizmos_render",
    "bevy_text",
    # (Fira Sans is embedded by src/app/fonts.rs instead of the default mono)
    "bevy_ui_render",
    # Clicking buttons
    "bevy_picking",
    "ui_picking",
    # Synthesised notes play through bevy_audio; no file codecs needed
    "bevy_audio",
    # Offscreen snapshots are saved as PNG
    "png",
] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# No terminal colours or "did you mean" suggestions: fewer crates to build.
clap = { version = "4.6.9", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
midir = "0.11.1"
# Without the default "parallel" feature, which pulls in rayon.
midly = { version = "0.5.3", default-features = false, features = ["std"] }
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

# Bevy is very slow unoptimised; optimise dependencies but not our crate.
[profile.dev.package."*"]
opt-level = 2
# Dependency debug info makes every binary ~200MB, slowing links and loads.
debug = false

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }

# A little optimisation for our own crate makes headless test frames cheaper
# without slowing incremental builds noticeably.
[profile.dev]
opt-level = 1

[package]
name = "keybard"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"
clap = { version = "4.6.9", features = ["derive"] }
crossbeam-channel = "0.5.17"
midir = "0.11.1"
midly = "0.5.3"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

# Bevy is very slow unoptimised; optimise dependencies but not our crate.
[profile.dev.package."*"]
opt-level = 2

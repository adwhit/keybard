[package]
name = "keybard"
version = "0.1.0"
edition = "2024"

# All tests are integration tests (tests/integration); skip the empty
# unit-test and doctest harnesses, each of which would link all of Bevy.
[lib]
test = false
doctest = false

[[bin]]
name = "keybard"
test = false

[dependencies]
bevy = "0.20.1"
clap = { version = "4.6.9", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
midir = "0.11.1"
midly = "0.5.3"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"

# Bevy is very slow unoptimised; optimise dependencies but not our crate.
[profile.dev.package."*"]
opt-level = 2
# Dependency debug info makes every binary ~200MB, slowing links and loads.
debug = false

# A little optimisation for our own crate makes headless test frames cheaper
# without slowing incremental builds noticeably.
[profile.dev]
opt-level = 1
